name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      # All three platforms, because the port's whole point is that the same
      # source behaves identically on each -- and because the test that
      # checks bin/ against the source can only check the host's binary, so
      # the matrix is what covers every shipped build.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      # git records the executable bit only where the filesystem has one, and
      # Windows does not, so a commit made from Windows ships these 0644 and
      # the plugin silently does nothing on Linux and macOS. The bit lives in
      # git's index, not on disk, so it is checked there.
      - name: Check the shipped binaries are executable in git
        if: runner.os == 'Linux'
        run: |
          bad=$(git ls-files -s bin/ | awk '$1 != "100755" && $4 !~ /\.exe$/ {print "  " $1 " " $4}')
          if [ -n "$bad" ]; then
            echo "::error::not executable in git's index:"
            echo "$bad"
            echo "restore it with:"
            echo "  git update-index --chmod=+x bin/tracedoc bin/tracedoc-linux-* bin/tracedoc-darwin-*"
            exit 1
          fi
      - name: Run test suite
        run: go test ./...
